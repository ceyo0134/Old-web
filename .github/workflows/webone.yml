name: webone
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'   # safety net: zincir koparsa yeniden baslat
concurrency:
  group: webone
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install WebOne
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 240 -o webone.deb https://github.com/atauenis/webone/releases/download/v0.19.0/webone.0.19.0.linux-amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./webone.deb
          which webone || dpkg -L webone | head -20

      - name: Install bore (TCP tunnel)
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install -m 755 bore /usr/local/bin/bore

      - name: Start WebOne (public login user:oldweb)
        run: |
          nohup webone 8080 -a "user:oldweb" --log webone.log > webone.out 2>&1 &
          sleep 8
          curl -s -o /dev/null -w "local status page: %{http_code}\n" http://127.0.0.1:8080/ || true
          tail -n 20 webone.out || true

      - name: Open TCP tunnel
        run: |
          nohup bore local 8080 --to bore.pub --port "${BORE_PORT:-40080}" > bore.log 2>&1 &
          sleep 6
          if ! grep -q "listening" bore.log; then
            pkill bore || true
            nohup bore local 8080 --to bore.pub > bore.log 2>&1 &
            sleep 6
          fi
          cat bore.log
        env:
          BORE_PORT: ${{ vars.BORE_PORT }}

      - name: Publish current proxy address
        run: |
          PORT=$(grep -oE 'bore\.pub:[0-9]+' bore.log | head -1 | cut -d: -f2)
          echo "Proxy: bore.pub:${PORT}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p status
          printf 'host: bore.pub\nport: %s\nupdated: %s\n' "$PORT" "$(date -u +%FT%TZ)" > status/address.txt
          git config user.name "old-web-bot"
          git config user.email "old-web-bot@users.noreply.github.com"
          git add status/address.txt
          git commit -m "proxy address" || true
          git pull --rebase -q || true
          git push -q || true

      - name: Keep running for 5 hours
        run: sleep 18000

      - name: Wait 10-20s then start the next round
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep $((10 + RANDOM % 11))
          gh workflow run webone.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
